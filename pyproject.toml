[project]
name = "airport-agent"
version = "0.1.0"
description = "Airport Investment Intelligence Agent — ranks/compares US airports for capacity-expansion investment"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airport_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: tests that hit the internet (skipped by default)", "llm: tests that call a live LLM provider (need GEMINI_API_KEY)"]
addopts = "-m 'not network' -q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
