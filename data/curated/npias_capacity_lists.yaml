# FAA national capacity outlook — runway capacity constraint status per airport.
#
# Transcribed verbatim from Figure 1 "National Capacity Outlook" (page 9) of the FAA
# NPIAS 2025-2029 narrative (published by the Secretary of Transportation on
# 2024-09-30). Figure 1 is a raster image inside the PDF, so the statuses below were
# read off the figure by hand; the transcription is arithmetically confirmed by the
# narrative text on the same page: "11 airports are expected to be runway capacity
# constrained in 2028, then increasing to 14 in 2033. An additional 13 airports are at
# risk of significant congestion through 2033." (11 / 14 / 13 — see the counts below.)
#
# FAA thresholds (NPIAS 2025-2029 p.10):
#   congested            = hourly runway capacity >60% exceeded >=50% of the time
#   capacity constrained = hourly runway capacity >80% exceeded >=50% of the time
#   severe               = hourly runway capacity >90% exceeded >=75% of the time
# The evaluation covers large and medium hubs only (2023 TAF IFR operations); airports
# absent from Figure 1 are label 0 ("none") — that means "not evaluated / not flagged",
# not "measured to be uncongested".
#
# Labels (highest applicable wins): 4 severe_2033, 3 constrained_2028, 2 constrained_2033,
# 1 congested, 0 none.
source_url: https://www.faa.gov/sites/faa.gov/files/airports/planning_capacity/npias/current/ARP-NPIAS-2025-2029-Narrative.pdf
source_title: "FAA NPIAS 2025-2029 narrative, Figure 1: National Capacity Outlook (p. 9)"
as_of: "2024-09"

# Severe capacity constraints in 2033 (7 airports).
severe_2033: [BOS, EWR, JFK, LAS, SAN, SEA, SFO]

# Capacity constrained already in 2028 (11 airports — matches the narrative's "11").
constrained_2028: [BOS, DCA, EWR, JFK, LAS, LAX, LGA, ORD, SAN, SEA, SFO]

# Capacity constrained (or severe) in 2033 (14 airports — matches the narrative's "14";
# a superset of constrained_2028).
constrained_2033: [ATL, BOS, BWI, DCA, EWR, JFK, LAS, LAX, LGA, MIA, ORD, SAN, SEA, SFO]

# Congested but not capacity constrained through 2033 (13 airports — matches the
# narrative's "An additional 13 airports are at risk of significant congestion").
congested: [CLT, DAL, DEN, DFW, FLL, HOU, IAD, MDW, PHL, PHX, SAT, SJC, SNA]

# Verbatim per-airport transcription of Figure 1 (provenance for the lists above; the
# four lists are derived from this map and `tests/data/test_faa_npias.py` checks they
# agree). Values: none | congested | constrained | severe.
figure_1_status:
  ATL: {2028: congested, 2033: constrained}
  BOS: {2028: constrained, 2033: severe}
  BWI: {2028: congested, 2033: constrained}
  CLT: {2028: none, 2033: congested}
  DAL: {2028: congested, 2033: congested}
  DCA: {2028: constrained, 2033: constrained}
  DEN: {2028: congested, 2033: congested}
  DFW: {2028: congested, 2033: congested}
  EWR: {2028: constrained, 2033: severe}
  FLL: {2028: none, 2033: congested}
  HOU: {2028: congested, 2033: congested}
  IAD: {2028: none, 2033: congested}
  JFK: {2028: constrained, 2033: severe}
  LAS: {2028: constrained, 2033: severe}
  LAX: {2028: constrained, 2033: constrained}
  LGA: {2028: constrained, 2033: constrained}
  MDW: {2028: none, 2033: congested}
  MIA: {2028: congested, 2033: constrained}
  ORD: {2028: constrained, 2033: constrained}
  PHL: {2028: none, 2033: congested}
  PHX: {2028: congested, 2033: congested}
  SAN: {2028: constrained, 2033: severe}
