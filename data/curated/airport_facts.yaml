# Hand-curated per-airport tier-B inputs and facts. Every input and fact carries its own
# source_url + as_of; airports without a verifiable source for a value simply omit it
# (product rule: no invented numbers).
#
# Conventions (human decision 2026-08-15, recorded in known-limitations-and-tradeoffs):
# * declared_rate_vmc = midpoint of the HIGHEST visual-configuration rate range in the FAA
#   Airport Capacity Profile (best-case throughput -- the denominator peak_hour_ops_ratio
#   compares peak demand against).
# * declared_rate_imc = midpoint of the LOWEST instrument-configuration range, excluding
#   "Low Instrument" rows (worst normal-IMC flow, so imc_capacity_ratio measures weather
#   vulnerability). Profiles are 2014-2019 and not since updated by the FAA (stale; as_of
#   states each profile's year).
# * gates: no authoritative public source was secured -- omitted for every airport, so
#   pax_per_gate and deps_per_gate_day are absent (see limitations log).
# * slot_or_cap_flag: 1 = FAA Level 3 slot-controlled (JFK, LGA, DCA), FAA Level 2
#   schedule-facilitated (ORD, LAX, EWR, SFO), or capacity capped by legal agreement (SNA
#   1985 Settlement Agreement). 0 = named by neither list on the FAA slot administration
#   page (its enumeration is exhaustive).

