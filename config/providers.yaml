# Runtime LLM providers (LiteLLM model strings). Gemini free tier only for now; add Groq / NVIDIA NIM
# later by appending entries. The first entry is primary, later ones are fallbacks.
providers:
  - name: gemini
    # A `-latest` alias, because gemini-2.5-flash was retired for new accounts (404): the aliases are
    # Google-maintained and always resolve to a currently-served model. flash-LITE specifically, for the
    # most generous free-tier limits of the family (higher RPM/RPD than flash), so interactive use is
    # slower to trip a 429.
    model: gemini/gemini-flash-lite-latest
    api_key_env: GEMINI_API_KEY
    rpm: 15
    max_retries: 2
    timeout_s: 60
default_temperature: 0.2
